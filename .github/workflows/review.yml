name: Portfolio review
on: pull_request
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke checks
        run: |
          npm run start -- -H 127.0.0.1 -p 3198 &
          trap 'kill $!' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:3198/ -o /dev/null
          python tests/browser_smoke.py
